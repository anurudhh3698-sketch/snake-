
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anurudh Singh - Snake Game</title>
<style>
  body {
    margin: 0;
    text-align: center;
    font-family: Arial, sans-serif;
    color: white;
    background: #101827;
    padding: 20px;
  }
  h1 { color: #39ff88; }
  .controls {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    margin: 18px auto;
    max-width: 600px;
  }
  label {
    background: #202d40;
    padding: 10px;
    border-radius: 10px;
  }
  select, button, input {
    margin: 5px;
    padding: 8px;
    border-radius: 6px;
  }
  canvas {
    width: min(90vw, 400px);
    height: auto;
    border: 2px solid #39ff88;
    border-radius: 10px;
    background: #172435;
    max-width: 400px;
  }
  button {
    cursor: pointer;
    border: 0;
    background: #39ff88;
    color: #101827;
    font-weight: bold;
  }
</style>
</head>
<body>
<h1>🐍 Anurudh Snake Game</h1>
<p>Score: <span id="score">0</span></p>

<div class="controls">
  <label>Snake
    <select id="snakeColor">
      <option value="#39ff88">Neon Green</option>
      <option value="#ff3366">Red</option>
      <option value="#3399ff">Blue</option>
      <option value="#c084fc">Purple</option>
      <option value="#ffd700">Gold</option>
    </select>
  </label>
  <label>Fruit
    <select id="fruit">
      <option value="🍎">Apple</option>
      <option value="🍊">Orange</option>
      <option value="🍒">Cherry</option>
      <option value="🍓">Strawberry</option>
      <option value="🍇">Grapes</option>
    </select>
  </label>
  <label>Background
    <select id="bg">
      <option value="#172435">Night</option>
      <option value="#143d25">Forest</option>
      <option value="#241344">Galaxy</option>
      <option value="#49301d">Desert</option>
    </select>
  </label>
  <label>World
    <select id="world">
      <option value="grid">Neon Grid</option>
      <option value="dots">Dot World</option>
      <option value="plain">Plain World</option>
    </select>
  </label>
</div>

<canvas id="game" width="400" height="400"></canvas>
<br>
<button onclick="startGame()">Start / Restart</button>
<p>Move: Arrow keys or WASD</p>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const size = 20;
const cells = canvas.width / size;

let snake, dx, dy, food, score, timer, running;

function randomFood() {
  let p;
  do {
    p = {
      x: Math.floor(Math.random() * cells),
      y: Math.floor(Math.random() * cells)
    };
  } while (snake.some(s => s.x === p.x && s.y === p.y));
  return p;
}

function startGame() {
  clearInterval(timer);
  snake = [{x: 10, y: 10}];
  dx = 1; dy = 0;
  score = 0;
  running = true;
  document.getElementById("score").textContent = score;
  food = randomFood();
  draw();
  timer = setInterval(update, 120);
}

function update() {
  if (!running) return;
  const head = {x: snake[0].x + dx, y: snake[0].y + dy};
  const eating = head.x === food.x && head.y === food.y;

  if (head.x < 0 || head.y < 0 ||
      head.x >= cells || head.y >= cells ||
      snake.slice(0, eating ? undefined : -1)
        .some(s => s.x === head.x && s.y === head.y)) {
    running = false;
    clearInterval(timer);
    draw();
    ctx.fillStyle = "white";
    ctx.font = "bold 26px Arial";
    ctx.textAlign = "center";
    ctx.fillText("GAME OVER", 200, 190);
    ctx.font = "16px Arial";
    ctx.fillText("Press Start to play again", 200, 220);
    return;
  }

  snake.unshift(head);
  if (eating) {
    score++;
    document.getElementById("score").textContent = score;
    food = randomFood();
  } else {
    snake.pop();
  }
  draw();
}

function draw() {
  ctx.fillStyle = document.getElementById("bg").value;
  ctx.fillRect(0, 0, 400, 400);

  const world = document.getElementById("world").value;
  if (world === "grid") {
    ctx.strokeStyle = "#ffffff12";
    for (let i = 0; i <= 400; i += size) {
      ctx.beginPath(); ctx.moveTo(i, 0);
      ctx.lineTo(i, 400); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i);
      ctx.lineTo(400, i); ctx.stroke();
    }
  } else if (world === "dots") {
    ctx.fillStyle = "#ffffff30";
    for (let x = 10; x < 400; x += size)
      for (let y = 10; y < 400; y += size) {
        ctx.beginPath();
        ctx.arc(x, y, 1.5, 0, Math.PI * 2);
        ctx.fill();
      }
  }

  if (food) {
    ctx.font = "18px Arial";
    ctx.textAlign = "center";
    ctx.fillText(
      document.getElementById("fruit").value,
      food.x * size + 10, food.y * size + 17
    );
  }

  snake.forEach((s, i) => {
    ctx.fillStyle = document.getElementById("snakeColor").value;
    ctx.shadowColor = ctx.fillStyle;
    ctx.shadowBlur = i === 0 ? 12 : 3;
    ctx.fillRect(s.x * size + 2, s.y * size + 2, 16, 16);
  });
  ctx.shadowBlur = 0;
}

document.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  const keys = ["arrowup", "arrowdown", "arrowleft", "arrowright",
                "w", "a", "s", "d"];
  if (keys.includes(k)) e.preventDefault();

  if ((k === "arrowup" || k === "w") && dy !== 1) {
    dx = 0; dy = -1;
  } else if ((k === "arrowdown" || k === "s") && dy !== -1) {
    dx = 0; dy = 1;
  } else if ((k === "arrowleft" || k === "a") && dx !== 1) {
    dx = -1; dy = 0;
  } else if ((k === "arrowright" || k === "d") && dx !== -1) {
    dx = 1; dy = 0;
  }
});

["snakeColor", "fruit", "bg", "world"].forEach(id => {
  document.getElementById(id).addEventListener("change", draw);
});

startGame();
</script>
</body>
</html>
